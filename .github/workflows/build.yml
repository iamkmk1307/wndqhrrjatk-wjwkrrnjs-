name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pandas openpyxl

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "URL_중복검사기" `
            --collect-all openpyxl `
            main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Force
          if (-not (Test-Path "dist\URL_중복검사기.exe")) {
            throw "EXE 파일이 생성되지 않았습니다."
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: URL_중복검사기-Windows
          path: dist/URL_중복검사기.exe
          if-no-files-found: error
          retention-days: 30
